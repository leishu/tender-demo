server:
  port: 8080


spring:
  application:
    name: tender-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/tender_demo?openTelemetry=DISABLED&useUnicode=true&characterEncoding=utf8
    username: tender
    password: tender123
    driver-class-name: com.mysql.cj.jdbc.Driver


llm:
  log-path: ./logs/llm
  # 模型调用审计（每次调用落一个 JSON 文件）
  audit:
    # 是否记录提示词、思考过程、回复与工具调用；false 时只保留模型名、token、耗时与状态
    capture-content: ${LLM_AUDIT_CAPTURE_CONTENT:true}
    # 单条文本字段的最大字符数；小于等于 0 时退回默认值 50000
    max-content-chars: ${LLM_AUDIT_MAX_CONTENT_CHARS:50000}
    retain-days: ${LLM_AUDIT_RETAIN_DAYS:30}
    max-files: ${LLM_AUDIT_MAX_FILES:5000}



agentscope:
  workspace-path: .agentscope/workspace
  model: glm-5.3
  # 从环境变量 AGENTSCOPE_API_KEY 读取，禁止硬编码到代码或配置文件中
  api-key: ${AGENTSCOPE_API_KEY:}
  # 可选：单轮思考 token 上限（如 8192），留空不限制；用于抑制超长推理
  thinking-budget: ${AGENTSCOPE_THINKING_BUDGET:}

  # 智能体状态存储（MySQL 表 t_agent_state）：过期会话清理
  state-store:
    cleanup:
      enabled: ${AGENT_STATE_CLEANUP_ENABLED:true}
      # 保留天数；早于“当前时间 - retain-days”的整段会话会被删除。<=0 表示不按时间清理
      # 默认 90 天，约等于三个月
      retain-days: ${AGENT_STATE_RETAIN_DAYS:90}
      # 单批删除的会话数，分批推进避免长事务持锁
      batch-size: ${AGENT_STATE_CLEANUP_BATCH_SIZE:1000}
      # 每天 04:00 执行；6 段 cron（秒 分 时 日 月 周）
      cron: "${AGENT_STATE_CLEANUP_CRON:0 0 4 * * *}"

  # workspace 会话记录清理：<workspace>/<userId>/agents/<agentId>/sessions/
  # 关闭 memory 后 transcript 仍在写，仍需清理
  workspace-cleanup:
    enabled: ${AGENTSCOPE_SESSION_CLEANUP_ENABLED:true}
    # 保留天数；<=0 表示不按时间清理
    retain-days: ${AGENTSCOPE_SESSION_RETAIN_DAYS:30}
    # 每个 agent 目录最多保留的会话组数；<=0 表示不按数量清理
    max-sessions-per-agent: ${AGENTSCOPE_SESSION_MAX_PER_AGENT:200}
    # 最近 N 分钟内修改过的会话不删，避免删掉正在写入的会话
    active-protection-minutes: ${AGENTSCOPE_SESSION_ACTIVE_PROTECTION_MINUTES:10}
    # 是否同时删除 default/<agentId>/<sessionId>/ 下的 events 文件；默认关闭
    cleanup-events: ${AGENTSCOPE_SESSION_CLEANUP_EVENTS:false}
    # 每天 03:30 执行；6 段 cron（秒 分 时 日 月 周）
    cron: "${AGENTSCOPE_SESSION_CLEANUP_CRON:0 30 3 * * *}"


# 任务与事件（断线续传、结果缓存）
tender:
  task:
    recovery:
      # 单实例保持 true：启动时把所有 pending/running 任务判定为中断。
      # 多实例/滚动发布必须设为 false，否则重启的实例会误杀其它实例正在执行的任务。
      assume-exclusive-startup: ${TENDER_TASK_RECOVERY_ASSUME_EXCLUSIVE_STARTUP:true}
      # 执行中任务超过该时长没有更新视为陈旧；<=0 关闭陈旧回收
      stale-minutes: ${TENDER_TASK_STALE_MINUTES:10}
      # 陈旧任务扫描间隔（毫秒）
      scan-interval-ms: ${TENDER_TASK_RECOVERY_SCAN_INTERVAL_MS:60000}
    # 同步任务（目录/章节）执行期间的心跳间隔（毫秒）；<=0 关闭
    heartbeat-ms: ${TENDER_TASK_HEARTBEAT_MS:30000}


# 人员/企业资质匹配
matching:
  # 首轮缺少结果或流失败时，只对缺失的 requirementId 自动补跑的最大次数；0 表示关闭
  max-retries: ${MATCHING_MAX_RETRIES:1}


# Langfuse 链路追踪（https://cloud.langfuse.com）
# 密钥从环境变量读取，禁止硬编码；enabled=false 时不会创建 OTel SDK
langfuse:
  enabled: ${LANGFUSE_ENABLED:true}
  # EU 区 https://cloud.langfuse.com；US 区 https://us.cloud.langfuse.com；JP 区 https://jp.cloud.langfuse.com
  host: ${LANGFUSE_HOST:https://cloud.langfuse.com}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  service-name: ${spring.application.name:tender-service}
  environment: ${LANGFUSE_ENVIRONMENT:local}
  # 全量采集为 1.0
  sample-rate: ${LANGFUSE_SAMPLE_RATE:1.0}
  # 是否上报提示词与模型回复；招标文件含敏感信息时可设为 false
  capture-content: ${LANGFUSE_CAPTURE_CONTENT:true}


# 知识库：向量检索 + 全文检索（Elasticsearch）
knowledge-base:
  index-name: knowledge_base
  es:
    # 多个节点用逗号分隔，如 http://host1:9200,http://host2:9200
    uris: ${ES_URIS:http://127.0.0.1:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    # 优先级高于用户名密码；带鉴权的 ES 只需配置其中一种
    api-key: ${ES_API_KEY:}
  embedding:
    # es: 使用 ES 内置 multilingual-e5-small（384 维，完全本地）
    # dashscope: 使用阿里云 DashScope text-embedding-v3（1024 维，需 api-key）
    provider: es
    # ES 内置 endpoint ID（ES 9.x 自带）
    es-endpoint-id: .multilingual-e5-small-elasticsearch
    # 必须与已有索引的 dense_vector dims 一致，修改后需重建索引
    dimension: 384
    batch-size: 100
    # DashScope 配置（provider=dashscope 时生效，provider=es 时忽略）
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
    path: /api/v1/services/embeddings/text-embedding/text-embedding
    api-key: "${DASHSCOPE_API_KEY:}"
    model: text-embedding-v3